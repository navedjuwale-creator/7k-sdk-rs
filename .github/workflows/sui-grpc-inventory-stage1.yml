name: Sui gRPC inventory Stage 1

on:
  push:
    branches:
      - migrate/sui-grpc-client
    paths:
      - "src/library/sui_grpc_inventory.rs"
      - "src/library/mod.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sui-grpc-inventory-stage1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sui-grpc-inventory-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2024 --check src/library/sui_grpc_inventory.rs

      - name: Compile all targets
        run: cargo check --all-targets

      - name: Run all tests
        run: cargo test --all-targets

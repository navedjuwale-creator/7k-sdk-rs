name: object_store quick-xml compatibility probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated experiment branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Probe pinned object_store upgrade
        id: probe
        continue-on-error: true
        run: |
          set +e
          cargo update -p object_store@0.10.2 --precise 0.14.1 > resolution.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat resolution.log
          exit "$rc"
      - name: Capture exact dependency constraints
        if: always()
        run: |
          {
            echo "=== pinned Sui SDK source reference ==="
            grep -n -E 'sui-sdk|testnet-v1.39.3' Cargo.toml || true
            echo "=== lockfile object_store and quick-xml versions ==="
            awk '/^name = "object_store"$/{p=1} p{print} p && /^$/{p=0}' Cargo.lock
            awk '/^name = "quick-xml"$/{p=1} p{print} p && /^$/{p=0}' Cargo.lock
            echo "=== resolution result ==="
            cat resolution.log
          } > probe-summary.txt
          cat probe-summary.txt
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: object-store-quick-xml-compatibility
          path: |
            resolution.log
            probe-summary.txt
          if-no-files-found: warn
          retention-days: 14

name: Dependency security audit

on:
  push:
    branches:
      - audit/dependency-security
      - security/remediate-cargo-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Audit Cargo.lock advisories
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Trace advisory dependency parents
        shell: bash
        run: |
          set +e
          for crate in aes-gcm bytes crossbeam-epoch crypto-bigint h2 idna protobuf quick-xml quinn-proto ring rsa rustls rustls-webpki time webpki-roots zstd zstd-safe zstd-sys anyhow cxx im keccak lru rand sized-chunks core2 futures-util spin rustls-pemfile; do
            echo "::group::Reverse dependency tree: ${crate}"
            cargo tree --locked --invert "${crate}"
            echo "::endgroup::"
          done

      - name: Audit locked dependencies
        run: cargo audit

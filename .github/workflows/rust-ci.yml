name: Rust CI

on:
  push:
    branches:
      - ci/remote-build-sui-deps
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check changed Rust files formatting
        run: rustfmt --edition 2021 --check src/client.rs src/library/get_coin_object_ids_by_amount.rs src/library/group_swap_routes.rs src/library/protocols/deepbook.rs src/library/protocols/deepbook_v3.rs src/library/protocols/flowx_v3.rs src/library/swap_with_route.rs
      - name: Compile and test
        run: cargo test --locked --all-targets

name: Sui gRPC object compatibility Stage 2

on:
  push:
    branches:
      - migrate/sui-grpc-client
    paths:
      - "crates/sui-grpc-inventory/**"
      - ".github/workflows/sui-grpc-object-stage2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sui-grpc-object-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2024 --check crates/sui-grpc-inventory/src/lib.rs crates/sui-grpc-inventory/src/object.rs

      - name: Compile all targets
        run: cargo check --manifest-path crates/sui-grpc-inventory/Cargo.toml --all-targets

      - name: Run all unit tests
        run: cargo test --manifest-path crates/sui-grpc-inventory/Cargo.toml --all-targets

      - name: Read live Sui Testnet object with pinned chain identity (read-only)
        env:
          SUI_TESTNET_EXPECTED_CHAIN_ID: 69WiPg3DAQiwdxfncX6wYQ2siKwAe6L9BZthQea3JNMD
        run: cargo test --manifest-path crates/sui-grpc-inventory/Cargo.toml live_testnet_chain_identity_and_read_only_object_lookup -- --ignored --nocapture

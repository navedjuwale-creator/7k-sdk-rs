name: Transitive dependency remediation candidate

on:
  push:
    branches:
      - security/transitive-dependency-remediation-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transitive-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Apply compatible advisory fixes and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Capture baseline
        run: |
          set -euo pipefail
          cp Cargo.lock Cargo.lock.before
          cargo tree --locked --prefix none > dependency-tree-before.txt

      - name: Attempt advisory-compatible updates
        shell: bash
        run: |
          set -u
          : > update-results.txt
          while IFS='|' read -r package version; do
            [ -n "$package" ] || continue
            echo "=== $package -> $version ===" | tee -a update-results.txt
            if cargo update -p "$package" --precise "$version" >> update-results.txt 2>&1; then
              echo "RESULT: updated" | tee -a update-results.txt
            else
              status=$?
              echo "RESULT: not applicable or update failed (exit $status)" | tee -a update-results.txt
            fi
          done <<'UPDATES'
          aes-gcm|0.10.3
          bytes|1.11.1
          crossbeam-epoch|0.9.20
          cxx|1.0.195
          h2@0.4.5|0.4.16
          keccak|0.1.6
          rand@0.8.5|0.8.6
          ring@0.17.8|0.17.12
          time|0.3.47
          zstd|0.13.4
          zstd-safe|7.4.0
          zstd-sys|2.1.2
          futures-util|0.3.31
          UPDATES
          cargo metadata --locked --format-version 1 > metadata.json
          cargo tree --locked --prefix none > dependency-tree-after.txt
          diff -u Cargo.lock.before Cargo.lock > Cargo.lock.diff || test "$?" -eq 1

      - name: Verify locked dependency graph and compile
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          cargo check --locked

      - name: Run focused test suite
        run: cargo test --locked

      - name: Run security audit (blocking)
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          set +e
          cargo audit --file Cargo.lock --json > cargo-audit.json
          audit_status=$?
          set -e
          echo "$audit_status" > cargo-audit.exit-code
          cat cargo-audit.json
          exit "$audit_status"

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transitive-dependency-remediation-candidate
          path: |
            Cargo.lock.before
            Cargo.lock
            Cargo.lock.diff
            update-results.txt
            metadata.json
            dependency-tree-before.txt
            dependency-tree-after.txt
            cargo-audit.json
            cargo-audit.exit-code
          if-no-files-found: warn
          retention-days: 14

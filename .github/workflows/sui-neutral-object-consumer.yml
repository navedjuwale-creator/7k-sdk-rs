name: Sui neutral object consumer
# Isolated consumer-side parsing and malformed-input validation.
on:
  push:
    branches:
      - test/sui-neutral-object-consumer
    paths:
      - "crates/sui-neutral-object-consumer/**"
      - "crates/sui-neutral-object-boundary/**"
      - ".github/workflows/sui-neutral-object-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sui-neutral-object-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format consumer source
        run: rustfmt --edition 2024 --check crates/sui-neutral-object-consumer/src/lib.rs
      - name: Compile consumer dependency domain independently
        run: cargo check --manifest-path crates/sui-neutral-object-consumer/Cargo.toml --all-targets
      - name: Run consumer boundary tests
        run: cargo test --manifest-path crates/sui-neutral-object-consumer/Cargo.toml --all-targets

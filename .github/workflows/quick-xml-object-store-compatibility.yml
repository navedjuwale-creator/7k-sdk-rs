name: quick-xml compatibility with pinned object_store 0.10.2 (separate XML error variants)

on:
  push:
    branches:
      - experiment/dependency-resolution-2026-11-02
    paths:
      - .github/workflows/quick-xml-object-store-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-transitive-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated experiment branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Download exact object_store 0.10.2 source into temporary directory
        run: |
          set -eu
          mkdir -p /tmp/object_store-0.10.2
          curl --fail --silent --show-error --location https://crates.io/api/v1/crates/object_store/0.10.2/download -o /tmp/object_store.crate
          tar -xzf /tmp/object_store.crate --strip-components=1 -C /tmp/object_store-0.10.2
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/object_store-0.10.2/Cargo.toml")
          s = p.read_text()
          print("Original quick-xml declaration:")
          for line in s.splitlines():
              if "quick-xml" in line:
                  print(line)
          import re
          pattern = r'(\[dependencies\.quick-xml\]\s*\nversion\s*=\s*)"[^"]+"'
          patched, count = re.subn(pattern, r'\1"0.41.0"', s, count=1)
          if count != 1:
              raise SystemExit("STOP: could not isolate [dependencies.quick-xml] version; no candidate patch applied")
          p.write_text(patched)
          print("Candidate patched only in /tmp: quick-xml = 0.41.0")
          # quick-xml 0.40+ separates serialization SeError from deserialization DeError.
          # Keep the existing deserialization variant and add a distinct serialization variant.
          q = Path("/tmp/object_store-0.10.2/src/gcp/client.rs")
          src = q.read_text()
          old_decl = "InvalidPutResponse { source: quick_xml::de::DeError },"
          new_decl = old_decl + "\n    InvalidPutResponseSerialization { source: quick_xml::se::SeError },"
          if src.count(old_decl) != 1:
              raise SystemExit("STOP: expected exactly one deserialization error declaration; no source patch applied")
          src = src.replace(old_decl, new_decl, 1)
          # Change only the context attached to the XML serialization operation.
          starts = [i for i in (src.find("quick_xml::se::to_writer"), src.find("quick_xml::se::to_string")) if i >= 0]
          if len(starts) != 1:
              raise SystemExit("STOP: expected exactly one supported XML serialization call; no context patch applied")
          pos = starts[0]
          ctx = "InvalidPutResponseSnafu"
          ctx_pos = src.find(ctx, pos)
          if ctx_pos < 0 or src.find(ctx, ctx_pos + len(ctx)) >= 0:
              raise SystemExit("STOP: could not isolate serialization context; no source patch applied")
          src = src[:ctx_pos] + "InvalidPutResponseSerializationSnafu" + src[ctx_pos + len(ctx):]
          q.write_text(src)
          print("Candidate patched only in /tmp: separate DeError and SeError variants; serialization context changed only")
          PY
      - name: Apply temporary local crate override
        run: |
          cat >> Cargo.toml <<'EOF'

          # Temporary CI-only compatibility probe; never commit this override.
          [patch.crates-io]
          object_store = { path = "/tmp/object_store-0.10.2" }
          EOF
      - name: Resolve quick-xml 0.41 against the patched object_store 0.10.2
        id: resolve
        continue-on-error: true
        run: |
          set +e
          cargo update -p quick-xml --precise 0.41.0 > resolution.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat resolution.log
          exit "$rc"
      - name: Compile temporary candidate graph
        if: steps.resolve.outcome == 'success'
        id: compile
        continue-on-error: true
        run: |
          set +e
          cargo tree --locked -i snafu > snafu-tree.txt 2>&1
          cargo tree --locked -i quick-xml > quick-xml-tree.txt 2>&1
          cp Cargo.lock candidate-Cargo.lock
          cargo check --locked > compile.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat compile.log
          exit "$rc"
      - name: Audit candidate lockfile
        if: steps.compile.outcome == 'success'
        id: audit
        continue-on-error: true
        run: |
          set +e
          cargo install cargo-audit --locked > audit-install.log 2>&1
          install_rc=$?
          if [ "$install_rc" -ne 0 ]; then
            echo "install_exit_code=$install_rc" > audit-summary.txt
            cat audit-install.log
            exit "$install_rc"
          fi
          cargo audit --file candidate-Cargo.lock --json > audit.json 2> audit.log
          rc=$?
          echo "exit_code=$rc" > audit-summary.txt
          cat audit.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("audit.json")
          try:
              data=json.loads(p.read_text())
              vuln=data.get("vulnerabilities", {})
              print("vulnerability_count=", vuln.get("count", "unknown"))
              print("warning_count=", len(data.get("warnings", {}).get("unmaintained", [])) + len(data.get("warnings", {}).get("unsound", [])) + len(data.get("warnings", {}).get("yanked", [])))
          except Exception as e:
              print("Could not parse cargo-audit JSON:", e)
          PY
          exit "$rc"
      - name: Write summary and restore tracked manifest
        if: always()
        env:
          RESOLUTION_OUTCOME: ${{ steps.resolve.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "candidate=object_store 0.10.2 with temporary quick-xml 0.41.0 and separate deserialization/serialization error variants"
            echo "resolution_outcome=$RESOLUTION_OUTCOME"
            echo "compile_outcome=$COMPILE_OUTCOME"
            echo "audit_outcome=$AUDIT_OUTCOME"
            if [ "$COMPILE_OUTCOME" = "success" ] && [ "$AUDIT_OUTCOME" = "success" ]; then echo "next=review candidate audit findings against baseline; still temporary only"; elif [ "$COMPILE_OUTCOME" = "success" ]; then echo "next=review audit output; candidate not accepted"; else echo "next=inspect compiler output; do not run audit as acceptance evidence"; fi
            echo "No Cargo.toml or Cargo.lock changes are committed by this workflow."
          } > probe-summary.txt
          git checkout -- Cargo.toml
          cat probe-summary.txt
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quick-xml-object-store-compatibility
          path: |
            resolution.log
            compile.log
            audit-install.log
            audit.json
            audit.log
            audit-summary.txt
            probe-summary.txt
            candidate-Cargo.lock
            snafu-tree.txt
            quick-xml-tree.txt
          if-no-files-found: warn
          retention-days: 14

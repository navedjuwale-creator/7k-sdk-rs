name: Isolated rustls and webpki remediation candidate

on:
  push:
    branches:
      - security/rustls-webpki-isolated-candidate
  pull_request:
    branches:
      - security/quinn-proto-isolated-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustls-webpki-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Update rustls and rustls-webpki, then verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Capture baseline
        run: |
          cp Cargo.lock Cargo.lock.before
          cargo tree --locked --invert='rustls-webpki@0.102.6' > rustls-webpki-path-before.txt
          cargo tree --locked --invert='rustls@0.23.12' > rustls-path-before.txt

      # Updating rustls resolves its compatible rustls-webpki dependency.
      # Avoid a second unqualified update because multiple webpki versions can
      # coexist in this graph, making the package selector ambiguous.
      - name: Update TLS verifier pair
        run: |
          cargo update -p rustls@0.23.12 --precise 0.23.46
          grep -q 'name = "rustls-webpki"' Cargo.lock
          grep -q 'version = "0.103.16"' Cargo.lock
          ! grep -A1 'name = "rustls-webpki"' Cargo.lock | grep -q 'version = "0.102.6"'

      - name: Record candidate delta
        run: |
          cargo tree --locked --invert='rustls-webpki@0.103.16' > rustls-webpki-path-after.txt
          cargo tree --locked --invert='rustls@0.23.46' > rustls-path-after.txt
          diff -u Cargo.lock.before Cargo.lock > Cargo.lock.diff || test "$?" -eq 1
          cargo tree --locked --prefix none > dependency-tree-after.txt
          grep -E '^(rustls|rustls-webpki|webpki-roots|hyper-rustls|quinn) v' dependency-tree-after.txt || true

      - name: Verify lockfile and compile
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo check --locked

      - name: Run focused tests
        run: cargo test --locked

      - name: Audit candidate lockfile
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit --file Cargo.lock

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustls-webpki-candidate
          path: |
            Cargo.lock.before
            Cargo.lock
            Cargo.lock.diff
            rustls-webpki-path-before.txt
            rustls-webpki-path-after.txt
            rustls-path-before.txt
            rustls-path-after.txt
            dependency-tree-after.txt
          if-no-files-found: warn
          retention-days: 14

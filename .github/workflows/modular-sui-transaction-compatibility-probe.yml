name: Modular Sui transaction compatibility probe

on:
  push:
    branches:
      - security/modular-sui-sdk-dependency-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modular-sui-transaction-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transaction-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Create isolated transaction compatibility fixture
        shell: bash
        env:
          PROBE_DIR: ${{ runner.temp }}/modular-sui-transaction-probe
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_DIR/src"
          cat > "$PROBE_DIR/Cargo.toml" <<'EOF'
          [package]
          name = "modular-sui-transaction-compatibility-probe"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          bcs = "0.1"
          sui-sdk = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.41.0", package = "sui-sdk" }
          sui-sdk-types = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "788907487b40bc341bd90ee26428c4098fc1e515", package = "sui-sdk-types", default-features = false, features = ["serde", "hash"] }
          sui-transaction-builder = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "788907487b40bc341bd90ee26428c4098fc1e515", package = "sui-transaction-builder" }
          EOF
          cat > "$PROBE_DIR/src/lib.rs" <<'EOF'
          use sui_sdk::types::{
              base_types::SuiAddress,
              programmable_transaction_builder::ProgrammableTransactionBuilder,
              transaction::{Argument as LegacyArgument, Command as LegacyCommand, TransactionKind as LegacyTransactionKind},
          };
          use sui_sdk_types::{Address, Digest};
          use sui_sdk_types::bcs::ToBcs;
          use sui_transaction_builder::{ObjectInput, TransactionBuilder};

          fn build_legacy_kind() -> LegacyTransactionKind {
              let mut builder = ProgrammableTransactionBuilder::new();
              let amount = builder.pure(1_000_000_000u64).expect("legacy pure amount");
              builder.command(LegacyCommand::SplitCoins(
                  LegacyArgument::GasCoin,
                  vec![amount],
              ));
              let first_split_coin = LegacyArgument::NestedResult(0, 0);
              let recipient = builder.pure(SuiAddress::ZERO).expect("legacy recipient");
              builder.command(LegacyCommand::TransferObjects(
                  vec![first_split_coin],
                  recipient,
              ));
              LegacyTransactionKind::ProgrammableTransaction(builder.finish())
          }

          fn build_modular_transaction() -> sui_sdk_types::Transaction {
              let mut tx = TransactionBuilder::new();
              let amount = tx.pure(&1_000_000_000u64);
              let gas = tx.gas();
              let coins = tx.split_coins(gas, vec![amount]);
              let recipient = tx.pure(&Address::ZERO);
              tx.transfer_objects(coins, recipient);
              tx.set_sender(Address::ZERO);
              tx.set_gas_budget(500_000_000);
              tx.set_gas_price(1_000);
              tx.add_gas_objects([ObjectInput::owned(Address::ZERO, 1, Digest::ZERO)]);
              tx.try_build().expect("modular transaction should build")
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn legacy_and_modular_ptb_bcs_are_byte_identical() {
                  let legacy = bcs::to_bytes(&build_legacy_kind())
                      .expect("serialize legacy TransactionKind");
                  let modular = build_modular_transaction().kind.to_bcs()
                      .expect("serialize modular TransactionKind");

                  std::fs::write("legacy.ptb.bcs", &legacy).expect("write legacy evidence");
                  std::fs::write("modular.ptb.bcs", &modular).expect("write modular evidence");

                  assert_eq!(
                      legacy,
                      modular,
                      "legacy and modular TransactionKind BCS bytes differ"
                  );
              }

              #[test]
              fn modular_transaction_bcs_round_trips() {
                  let tx = build_modular_transaction();
                  let bytes = tx.to_bcs().expect("serialize full modular transaction");
                  let decoded = sui_sdk_types::Transaction::from_bcs(&bytes)
                      .expect("deserialize modular transaction");
                  assert_eq!(decoded, tx);
              }

              #[test]
              fn modular_ptb_bcs_is_deterministic() {
                  let first = build_modular_transaction().kind.to_bcs().expect("first encoding");
                  let second = build_modular_transaction().kind.to_bcs().expect("second encoding");
                  assert_eq!(first, second);
              }
          }

          EOF
          printf 'SDK revision: 788907487b40bc341bd90ee26428c4098fc1e515\n' > "$PROBE_DIR/probe-info.txt"
          printf 'Scope: offline legacy-vs-modular TransactionKind BCS byte comparison, modular transaction BCS round-trip\n' >> "$PROBE_DIR/probe-info.txt"
          printf 'No application source, signing, network submission, or wallet access\n' >> "$PROBE_DIR/probe-info.txt"

      - name: Resolve and lock fixture dependencies
        working-directory: ${{ runner.temp }}/modular-sui-transaction-probe
        run: |
          set -euo pipefail
          # Seed with pinned Sui 1.41.0 lockfile to retain yanked core2 0.4.0.
          curl --fail --silent --show-error --location --output Cargo.lock "https://raw.githubusercontent.com/MystenLabs/sui/4b4e533f03530cc8eb9af1ed004aecfe95756e28/Cargo.lock"
          grep -A 5 'name = "core2"' Cargo.lock
          # Modular SDK requires serde >=1.0.228; advance only that locked crate.
          cargo update -p serde --precise 1.0.229
          cargo metadata --format-version 1 > metadata.json
          cargo metadata --format-version 1 --locked > /dev/null

      - name: Compile and run compatibility fixture
        working-directory: ${{ runner.temp }}/modular-sui-transaction-probe
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --check
          cargo test --locked --all-targets

      - name: Upload transaction compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modular-sui-transaction-compatibility-evidence
          path: |
            ${{ runner.temp }}/modular-sui-transaction-probe/Cargo.toml
            ${{ runner.temp }}/modular-sui-transaction-probe/Cargo.lock
            ${{ runner.temp }}/modular-sui-transaction-probe/probe-info.txt
            ${{ runner.temp }}/modular-sui-transaction-probe/metadata.json
            ${{ runner.temp }}/modular-sui-transaction-probe/legacy.ptb.bcs
            ${{ runner.temp }}/modular-sui-transaction-probe/modular.ptb.bcs
          if-no-files-found: warn
          retention-days: 14
 Cargo.lock
          # The modular SDK requires serde >=1.0.228; advance only that locked crate.
          cargo update -p serde --precise 1.0.229
          cargo metadata --format-version 1 > metadata.json
          cargo metadata --format-version 1 --locked > /dev/null

      - name: Compile and run compatibility fixture
        working-directory: ${{ runner.temp }}/modular-sui-transaction-probe
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --check
          cargo test --locked --all-targets

      - name: Upload transaction compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modular-sui-transaction-compatibility-evidence
          path: |
            ${{ runner.temp }}/modular-sui-transaction-probe/Cargo.toml
            ${{ runner.temp }}/modular-sui-transaction-probe/Cargo.lock
            ${{ runner.temp }}/modular-sui-transaction-probe/probe-info.txt
            ${{ runner.temp }}/modular-sui-transaction-probe/metadata.json
            ${{ runner.temp }}/modular-sui-transaction-probe/legacy.ptb.bcs
            ${{ runner.temp }}/modular-sui-transaction-probe/modular.ptb.bcs
          if-no-files-found: warn
          retention-days: 14

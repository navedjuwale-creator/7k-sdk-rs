[package]
name = "sevenk"
version = "0.0.1"
edition = "2024"
resolver = "2"

[dependencies]
anyhow = "1.0"
reqwest = "0.12.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
chrono = "0.4.39"
tokio = { version = "1.40", features = ["full"] }

[dependencies.sui_sdk]
git = "https://github.com/mystenlabs/sui"
tag = "testnet-v1.41.0"
package = "sui-sdk"

[dependencies.sui_keys]
git = "https://github.com/mystenlabs/sui"
tag = "testnet-v1.41.0"
package = "sui-keys"

[dependencies.move_core_types]
git = "https://github.com/mystenlabs/sui"
tag = "testnet-v1.41.0"
package = "move-core-types"

[dependencies.shared_crypto]
git = "https://github.com/mystenlabs/sui"
tag = "testnet-v1.41.0"
package = "shared-crypto"

[dependencies.sui_transaction_builder]
git = "https://github.com/mystenlabs/sui"
tag = "testnet-v1.41.0"
package = "sui-transaction-builder"

# Isolated compatibility probe: replace all four Sui-pinned Anemo workspace
# crates with the coordinated upstream dependency update. No Sui tag changes.
[patch."https://github.com/mystenlabs/anemo.git"]
anemo = { git = "https://github.com/mystenlabs/anemo", rev = "9c52c3c7946532163a79129db15180cdb984bab4" }
anemo-build = { git = "https://github.com/mystenlabs/anemo", rev = "9c52c3c7946532163a79129db15180cdb984bab4" }
anemo-cli = { git = "https://github.com/mystenlabs/anemo", rev = "9c52c3c7946532163a79129db15180cdb984bab4" }
anemo-tower = { git = "https://github.com/mystenlabs/anemo", rev = "9c52c3c7946532163a79129db15180cdb984bab4" }
